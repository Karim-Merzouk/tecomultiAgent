[project]
name = "telco-multiagent"
version = "0.1.0"
description = "Phase-1 prompted multi-agent baseline for TelcoAgent-Bench"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
telco-ma = "telco_multiagent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
